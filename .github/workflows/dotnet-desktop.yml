name: .NET CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore Backend/ECommerceWeb.sln

      - name: Build solution
        run: dotnet build Backend/ECommerceWeb.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Backend/ECommerceWeb.sln --configuration Release --no-build --logger "trx;LogFileName=test_results.trx"
